name: Patch article sync v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-article-sync-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('server.js')
          s = p.read_text(encoding='utf-8')

          old = """            const articleNum = match[2] || '';\n            const paragraphNum = match[3] || match[4] || '';\n            if (articleNum) currentArticle = articleNum;\n\n            const effectiveLaw = anchorLaw;\n            const effectiveArticle = currentArticle;\n"""
          new = """            const articleNum = match[2] || '';\n            const paragraphNum = match[3] || '';\n            const standaloneParagraphNum = match[4] || '';\n            if (articleNum) currentArticle = articleNum;\n\n            const effectiveLaw = anchorLaw;\n            const effectiveArticle = standaloneParagraphNum ? '' : currentArticle;\n"""
          if old not in s:
              raise SystemExit('PATCH 1 target parsing block not found')
          s = s.replace(old, new, 1)

          old = """            } else if (paragraphNum) {\n                targetName = `제${paragraphNum}항`;\n                searchTargetKey = `${effectiveLaw}_항_${paragraphNum}`;\n"""
          new = """            } else if (standaloneParagraphNum) {\n                targetName = `제${standaloneParagraphNum}항`;\n                searchTargetKey = `${effectiveLaw}_항_${standaloneParagraphNum}`;\n"""
          if old not in s:
              raise SystemExit('PATCH 2 standalone paragraph block not found')
          s = s.replace(old, new, 1)

          old = """                        articleNum: effectiveArticle,\n                        paragraphNum: paragraphNum,\n                        targetName: targetName,\n"""
          new = """                        articleNum: effectiveArticle,\n                        paragraphNum: paragraphNum,\n                        standaloneParagraphNum: standaloneParagraphNum,\n                        targetName: targetName,\n"""
          if old not in s:
              raise SystemExit('PATCH 3 target object not found')
          s = s.replace(old, new, 1)

          old = """            const currentMatchThreshold = target.paragraphNum\n               ? MATCH_THRESHOLD + 0.10\n               : MATCH_THRESHOLD;\n\n             const currentReplacementThreshold = target.paragraphNum\n               ? REPLACEMENT_THRESHOLD + 0.10\n               : REPLACEMENT_THRESHOLD;\n"""
          new = """            const hasArticleAndParagraph =\n                Boolean(target.articleNum && target.paragraphNum);\n\n            const currentMatchThreshold = hasArticleAndParagraph\n                ? MATCH_THRESHOLD + 0.10\n                : MATCH_THRESHOLD;\n\n            const currentReplacementThreshold = hasArticleAndParagraph\n                ? REPLACEMENT_THRESHOLD + 0.10\n                : REPLACEMENT_THRESHOLD;\n"""
          if old not in s:
              raise SystemExit('PATCH 4 threshold block not found')
          s = s.replace(old, new, 1)

          old = """            const verifyQuery = `${lawContext} \"제${target.articleNum}조${target.paragraphNum ? ` 제${target.paragraphNum}항` : '항'}\" ${topKeywords.join(' ')}`;\n"""
          new = """            const citation = target.standaloneParagraphNum\n                ? `제${target.standaloneParagraphNum}항`\n                : target.articleNum && target.paragraphNum\n                    ? `제${target.articleNum}조 제${target.paragraphNum}항`\n                    : `제${target.articleNum}조`;\n            const verifyQuery = `${lawContext} \"${citation}\" ${topKeywords.join(' ')}`;\n"""
          if old not in s:
              raise SystemExit('PATCH 5 verify query not found')
          s = s.replace(old, new, 1)

          old = """            const candidateRegex = new RegExp(`([가-힣]{1,10}${lawSuffix})?\\\\s*제\\\\s*(\\\\d+)\\\\s*조(?:\\\\s*제\\\\s*(\\\\d+)\\\\s*항)?`, 'g');\n            const candidateMatches = [...text2.matchAll(candidateRegex)];\n"""
          new = """            const candidateRegex = new RegExp(\n                `(?:(?:(?:([가-힣]{1,10}${lawSuffix})?\\\\s*제\\\\s*(\\\\d+)\\\\s*조(?:\\\\s*제\\\\s*(\\\\d+)\\\\s*항)?)|(?:(?:([가-힣]{1,10}${lawSuffix})?\\\\s*제\\\\s*(\\\\d+)\\\\s*항)))`,\n                'g'\n            );\n            const candidateMatches = [...text2.matchAll(candidateRegex)];\n"""
          if old not in s:
              raise SystemExit('PATCH 6 candidate regex not found')
          s = s.replace(old, new, 1)

          old = """                const candLaw = (cand[1] || lawContext).trim();\n                const candArticle = cand[2];\n                const candParagraph = cand[3] || '';\n\n                // 원래 조항과 완전히 동일한 후보는 이미 1단계에서 불일치 처리되었으므로 스킵\n                if (candLaw === lawContext && candArticle === target.articleNum && candParagraph === (target.paragraphNum || '')) {\n                    continue;\n                }\n"""
          new = """                const candLaw = (cand[1] || cand[4] || lawContext).trim();\n                const candArticle = cand[2] || '';\n                const candParagraph = cand[3] || '';\n                const candStandaloneParagraph = cand[5] || '';\n\n                // 원래 조항과 완전히 동일한 후보는 이미 1단계에서 불일치 처리되었으므로 스킵\n                const sameTarget = target.standaloneParagraphNum\n                    ? candLaw === lawContext && candStandaloneParagraph === target.standaloneParagraphNum\n                    : candLaw === lawContext &&\n                      candArticle === target.articleNum &&\n                      candParagraph === (target.paragraphNum || '') &&\n                      !candStandaloneParagraph;\n                if (sameTarget) {\n                    continue;\n                }\n"""
          if old not in s:
              raise SystemExit('PATCH 7 candidate parsing block not found')
          s = s.replace(old, new, 1)

          old = """                    bestScore = score;\n                    bestCandidate = { candLaw, candArticle, candParagraph };\n"""
          new = """                    bestScore = score;\n                    bestCandidate = {\n                        candLaw,\n                        candArticle,\n                        candParagraph,\n                        candStandaloneParagraph\n                    };\n"""
          if old not in s:
              raise SystemExit('PATCH 8 best candidate block not found')
          s = s.replace(old, new, 1)

          old = """                const newTargetName = bestCandidate.candParagraph\n                    ? `제${bestCandidate.candArticle}조 제${bestCandidate.candParagraph}항`\n                    : `제${bestCandidate.candArticle}조`;\n"""
          new = """                const newTargetName = bestCandidate.candStandaloneParagraph\n                    ? `제${bestCandidate.candStandaloneParagraph}항`\n                    : bestCandidate.candParagraph\n                        ? `제${bestCandidate.candArticle}조 제${bestCandidate.candParagraph}항`\n                        : `제${bestCandidate.candArticle}조`;\n"""
          if old not in s:
              raise SystemExit('PATCH 9 new target block not found')
          s = s.replace(old, new, 1)

          old = """                const oldArticleRegex = target.paragraphNum\n                    ? new RegExp(`제\\\\s*${target.articleNum}\\\\s*조\\\\s*제\\\\s*${target.paragraphNum}\\\\s*항`, 'g')\n                    : new RegExp(`제\\\\s*${target.articleNum}\\\\s*조`, 'g');\n"""
          new = """                const oldArticleRegex = target.standaloneParagraphNum\n                    ? new RegExp(`제\\\\s*${target.standaloneParagraphNum}\\\\s*항`, 'g')\n                    : target.paragraphNum\n                        ? new RegExp(`제\\\\s*${target.articleNum}\\\\s*조\\\\s*제\\\\s*${target.paragraphNum}\\\\s*항`, 'g')\n                        : new RegExp(`제\\\\s*${target.articleNum}\\\\s*조`, 'g');\n"""
          if old not in s:
              raise SystemExit('PATCH 10 replacement regex block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate syntax
        run: node --check server.js
      - name: Commit patch and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git rm -f .github/workflows/patch-article-sync.yml .github/workflows/patch-article-sync-v2.yml
          git commit -m 'Fix standalone paragraph citation synchronization'
          git push origin HEAD:main
