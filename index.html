<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 상식 퀴즈</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #d01c67;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 20px 0;
        }
        #quiz-container {
            min-height: 250px;
            text-align: left;
        }
        .question-text {
            font-size: 1.15em;
            margin-bottom: 20px;
            font-weight: bold;
            line-height: 1.5;
        }
        /* 코딩 문제용 코드 블록 스타일 */
        pre {
            background-color: #2d2d2d;
            color: #ccc;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9em;
            margin: 10px 0;
        }
        code {
            font-family: 'Consolas', 'Courier New', monospace;
        }
        .choices button {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fff;
            text-align: left;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s ease;
        }
        .choices button:hover:not(:disabled) {
            background-color: #e6f7ff;
            border-color: #4a90e2;
        }
        .choices button.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
            font-weight: bold;
        }
        .choices button.incorrect {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
            font-weight: bold;
        }
        #explanation-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f8ff;
            border-left: 5px solid #4a90e2;
            border-radius: 0 8px 8px 0;
            font-size: 0.95em;
            line-height: 1.4;
            display: none;
        }
        #result-message {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }
        #nav-buttons {
            margin-top: 20px;
        }
        #nav-buttons button {
            padding: 12px 24px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95em;
            transition: opacity 0.2s;
        }
        #nav-buttons button:hover {
            opacity: 0.9;
        }
        .btn-primary {
            background-color: #4a90e2;
            color: white;
        }
        .btn-warning {
            background-color: #f5a623;
            color: white;
        }
        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
        /* 복습 모드 스타일 */
        #review-list {
            margin-top: 20px;
            list-style: none;
            padding: 0;
        }
        .review-item {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-align: left;
        }
        .review-item p {
            margin: 6px 0;
        }
        .review-item .question-text {
            color: #856404;
            font-size: 1.05em;
        }
        .review-item .correct-answer {
            color: #007bff;
            font-weight: bold;
        }
        .review-item .review-explanation {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ffeeba;
            color: #555;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="page-title">오늘의 상식 퀴즈</h1>
        <hr>
        
        <div id="loading" style="display: none; color: #d01c67; text-align: center; margin-bottom: 20px; font-weight: bold;">
            데이터 로딩 중...
        </div>
        
        <div id="quiz-container">
            <p>상식 퀴즈를 시작하려면 "퀴즈 시작" 버튼을 누르세요.</p>
        </div>

        <div id="nav-buttons"></div>
    </div>

    <script>
        const QUIZ_API_URL = '/api/quiz';
        const ANSWER_KEY_API_URL = '/api/answer-key'; 
        const STORAGE_KEY = 'wrong_answers'; 

        let currentQuizData = []; 
        let currentQuestionIndex = 0;
        let score = 0;

        const quizContainer = document.getElementById('quiz-container');
        const navButtons = document.getElementById('nav-buttons');
        const loadingDiv = document.getElementById('loading');
        const pageTitle = document.getElementById('page-title');

        // ==========================================================
        // 헬퍼 함수 (XSS 방지 및 텍스트 포맷팅)
        // ==========================================================
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatText(str) {
            if (!str) return '';
            let formatted = escapeHtml(str);
            // 코드 블록(```) 렌더링 지원
            formatted = formatted.replace(/```(?:[a-zA-Z]*)\n?([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            // 줄바꿈 처리
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }

        // ==========================================================
        // Local Storage 관리 함수
        // ==========================================================
        function getWrongAnswers() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        function addWrongAnswer(questionData, selectedIndex, actualCorrectIndex) {
            const wrongAnswers = getWrongAnswers();
            const existingIndex = wrongAnswers.findIndex(item => item.id === questionData.id);

            const newEntry = {
                id: questionData.id,
                question: questionData.question,
                choices: questionData.choices,
                explanation: questionData.explanation,
                correctAnswerIndex: actualCorrectIndex,
                userAnswerIndex: selectedIndex,
                savedTime: new Date().toLocaleString('ko-KR')
            };

            if (existingIndex !== -1) {
                wrongAnswers[existingIndex] = newEntry;
            } else {
                wrongAnswers.push(newEntry);
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify(wrongAnswers));
        }

        function clearWrongAnswers() {
            if (confirm('복습 문제를 모두 삭제하시겠습니까?')) {
                localStorage.removeItem(STORAGE_KEY);
                showReviewMode(); 
            }
        }

        // ==========================================================
        // 메인 퀴즈 로직 (병렬 Fetch 적용)
        // ==========================================================
        async function loadQuizData(retryCount = 0) {
            pageTitle.textContent = '오늘의 상식 퀴즈';
            quizContainer.innerHTML = '';
            navButtons.innerHTML = '';
            loadingDiv.style.display = 'block';
            loadingDiv.innerText = retryCount > 0 ? `서버 응답 기다리는 중... (재시도 ${retryCount}/2)` : "데이터 로딩 중...";

            try {
                // 퀴즈와 정답 키를 병렬로 호출하여 속도 향상
                const [quizRes, answerRes] = await Promise.all([
                    fetch(QUIZ_API_URL),
                    fetch(ANSWER_KEY_API_URL)
                ]);

                if (quizRes.status === 503 && retryCount < 2) {
                    setTimeout(() => loadQuizData(retryCount + 1), 3000);
                    return;
                }

                if (!quizRes.ok || !answerRes.ok) {
                    throw new Error(`API 요청 실패 (코드: ${quizRes.status})`);
                }

                const [quizData, answerMap] = await Promise.all([
                    quizRes.json(),
                    answerRes.json()
                ]);

                currentQuizData = quizData.map(q => ({
                    ...q,
                    correctAnswerIndex: Number(answerMap[q.id])
                }));

                currentQuestionIndex = 0;
                score = 0;
                loadingDiv.style.display = 'none';
                displayQuestion();

            } catch (error) {
                loadingDiv.style.display = 'none';
                quizContainer.innerHTML = `<p style="color: #dc3545; text-align: center;">로딩 실패: ${escapeHtml(error.message)}<br>서버가 잠시 자는 중일 수 있습니다. 잠시 후 다시 시도해 주세요.</p>`;
                showHomeButtons();
            }
        }

        function displayQuestion() {
            if (currentQuestionIndex >= currentQuizData.length) {
                showResults();
                return;
            }

            const question = currentQuizData[currentQuestionIndex];
            
            if (typeof question.correctAnswerIndex === 'undefined' || isNaN(question.correctAnswerIndex)) {
                quizContainer.innerHTML = `<p style="color: #dc3545;">[오류] 정답 정보를 가져오지 못했습니다.</p>`;
                return;
            }
            
            const choicesHtml = question.choices.map((choice, index) => `
                <button onclick="checkAnswer(${index})">${formatText(choice)}</button>
            `).join('');

            quizContainer.innerHTML = `
                <div class="question-text">(${currentQuestionIndex + 1}/${currentQuizData.length}) ${formatText(question.question)}</div>
                <div class="choices" id="choices-container">
                    ${choicesHtml}
                </div>
                <div id="feedback" style="margin-top: 15px; font-weight: bold;"></div>
                <div id="explanation-box">
                    <strong>해설:</strong> <span id="explanation-text">${formatText(question.explanation) || '해설이 제공되지 않았습니다.'}</span>
                </div>
            `;
            navButtons.innerHTML = ''; 
        }

        function checkAnswer(selectedIndex) {
            const question = currentQuizData[currentQuestionIndex];
            const actualCorrectIndex = question.correctAnswerIndex;
            const isCorrect = (selectedIndex === actualCorrectIndex);
            
            const choicesContainer = document.getElementById('choices-container');
            const feedbackDiv = document.getElementById('feedback');
            const explanationBox = document.getElementById('explanation-box'); 
            
            Array.from(choicesContainer.children).forEach((button, index) => {
                button.disabled = true;
                if (index === actualCorrectIndex) {
                    button.classList.add('correct'); 
                }
                if (index === selectedIndex && !isCorrect) {
                    button.classList.add('incorrect'); 
                }
            });

            if (isCorrect) {
                score++;
                feedbackDiv.innerHTML = '<span style="color: #28a745;">✅ 정답입니다!</span>';
            } else {
                feedbackDiv.innerHTML = '<span style="color: #dc3545;">❌ 오답입니다.</span>';
                addWrongAnswer(question, selectedIndex, actualCorrectIndex);
            }

            explanationBox.style.display = 'block';
            navButtons.innerHTML = `<button class="btn-primary" onclick="nextQuestion()">다음 문제 (${currentQuestionIndex + 1}/${currentQuizData.length})</button>`;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            displayQuestion();
        }

        function showResults() {
            quizContainer.innerHTML = `
                <h2>퀴즈 종료!</h2>
                <p id="result-message">최종 점수: ${score} / ${currentQuizData.length}</p>
                <p style="color: #6c757d;">틀린 문제는 복습 모드에 자동 저장되었습니다.</p>
            `;
            showHomeButtons();
        }

        // ==========================================================
        // 복습 모드 로직
        // ==========================================================
        function showReviewMode() {
            pageTitle.textContent = '📝 오답 복습 모드';
            navButtons.innerHTML = '';
            
            const wrongAnswers = getWrongAnswers();
            
            if (wrongAnswers.length === 0) {
                quizContainer.innerHTML = `<p style="text-align: center; color: #6c757d;">현재 저장된 오답 문제가 없습니다.<br>메인 퀴즈에서 문제를 틀리면 자동 저장됩니다!</p>`;
            } else {
                const reviewListHtml = wrongAnswers.map(item => {
                    const correctAnswerText = item.choices[item.correctAnswerIndex];
                    const userAnswerText = item.choices[item.userAnswerIndex];

                    return `
                        <li class="review-item">
                            <div class="question-text">Q: ${formatText(item.question)}</div>
                            <p>선택했던 오답: <span style="color: #dc3545; font-weight: bold;">${formatText(userAnswerText)}</span></p>
                            <p class="correct-answer">정답: ${formatText(correctAnswerText)}</p>
                            <div class="review-explanation">해설: ${formatText(item.explanation) || '해설이 제공되지 않았습니다.'}</div>
                            <p style="font-size: 0.8em; color: #6c757d; margin-top: 8px;">(저장 시간: ${item.savedTime})</p>
                        </li>
                    `;
                }).join('');

                quizContainer.innerHTML = `
                    <h3 style="margin-top: 0;">총 ${wrongAnswers.length}개의 복습 문제</h3>
                    <ul id="review-list">
                        ${reviewListHtml}
                    </ul>
                    <button class="btn-danger" onclick="clearWrongAnswers()">복습 문제 전체 삭제</button>
                `;
            }
            showHomeButtons();
        }

        // ==========================================================
        // UI 네비게이션
        // ==========================================================
        function showHomeButtons() {
            navButtons.innerHTML = `
                <button class="btn-primary" onclick="loadQuizData()">퀴즈 시작</button>
                <button class="btn-warning" onclick="showReviewMode()">복습 모드 (${getWrongAnswers().length})</button>
            `;
        }

        showHomeButtons();
    </script>
</body>
</html>
