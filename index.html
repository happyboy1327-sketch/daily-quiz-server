<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 상식 퀴즈</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #d01c67;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 20px 0;
        }
        #quiz-container {
            min-height: 250px;
            text-align: left;
        }
        .question-text {
            font-size: 1.15em;
            margin-bottom: 20px;
            font-weight: bold;
            line-height: 1.5;
        }
        pre {
            background-color: #2d2d2d;
            color: #ccc;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9em;
            margin: 10px 0;
        }
        code {
            font-family: 'Consolas', 'Courier New', monospace;
        }
        .choices button {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fff;
            text-align: left;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s ease;
        }
        .choices button:hover:not(:disabled) {
            background-color: #e6f7ff;
            border-color: #4a90e2;
        }
        .choices button.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
            font-weight: bold;
        }
        .choices button.incorrect {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
            font-weight: bold;
        }
        #explanation-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f8ff;
            border-left: 5px solid #4a90e2;
            border-radius: 0 8px 8px 0;
            font-size: 0.95em;
            line-height: 1.4;
            display: none;
        }
        #result-message {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }
        #nav-buttons {
            margin-top: 20px;
        }
        #nav-buttons button {
            padding: 12px 24px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95em;
            transition: opacity 0.2s;
        }
        #nav-buttons button:hover {
            opacity: 0.9;
        }
        .btn-primary {
            background-color: #4a90e2;
            color: white;
        }
        .btn-warning {
            background-color: #f5a623;
            color: white;
        }
        .btn-danger {
            background-color: #E1BEE7 !important;
            color: #000000 !important;
            border: 1px solid #ffffff !important;
        }
        /* 복습 모드 */
        #review-list {
            margin-top: 20px;
            list-style: none;
            padding: 0;
        }
        .review-item {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-align: left;
        }
        .review-item p {
            margin: 6px 0;
        }
        .review-item .question-text {
            color: #856404;
            font-size: 1.05em;
        }
        .review-item .correct-answer {
            color: #007bff;
            font-weight: bold;
        }
        .review-item .review-explanation {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ffeeba;
            color: #555;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="page-title">오늘의 상식 퀴즈</h1>
        <hr>
        
        <div id="loading" style="display: none; color: #d01c67; text-align: center; margin-bottom: 20px; font-weight: bold;">
            데이터 로딩 중...
        </div>
        
        <div id="quiz-container">
            <p>상식 퀴즈를 시작하려면 "퀴즈 시작" 버튼을 누르세요.</p>
        </div>

        <div id="nav-buttons"></div>
    </div>

    <script>
        const QUIZ_API_URL = '/api/quiz';
        const ANSWER_KEY_API_URL = '/api/answer-key'; 
        const STORAGE_KEY = 'wrong_answers'; 

        let currentQuizData = []; 
        let currentQuestionIndex = 0;
        let score = 0;

        const quizContainer = document.getElementById('quiz-container');
        const navButtons = document.getElementById('nav-buttons');
        const loadingDiv = document.getElementById('loading');
        const pageTitle = document.getElementById('page-title');

        // ==========================================================
        // 헬퍼 함수 (XSS 방지 및 텍스트 포맷팅)
        // ==========================================================
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatText(str) {
            if (!str) return '';
            let formatted = escapeHtml(str);
            formatted = formatted.replace(/```(?:[a-zA-Z]*)\n?([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }

        // ==========================================================
        // Local Storage 오답 노트
        // ==========================================================
        function getWrongAnswers() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (!data) return [];
                const parsed = JSON.parse(data);
                if (!Array.isArray(parsed)) return [];
                
                return parsed.filter(item => 
                    item && 
                    item.id !== undefined && 
                    Array.isArray(item.choices)
                );
            } catch (e) {
                console.warn("LocalStorage 데이터 충돌 감지. 데이터 초기화 실행");
                localStorage.removeItem(STORAGE_KEY);
                return [];
            }
        }

        function addWrongAnswer(questionData, selectedIndex, actualCorrectIndex) {
            try {
                const wrongAnswers = getWrongAnswers();
                const existingIndex = wrongAnswers.findIndex(item =>
                    item.question === questionData.question &&
                    JSON.stringify(item.choices) === JSON.stringify(questionData.choices)
                );

                const newEntry = {
                    id: String(questionData.id ?? ''),
                    question: questionData.question || '내용 없음',
                    choices: Array.isArray(questionData.choices) ? questionData.choices : [],
                    explanation: questionData.explanation || '',
                    correctAnswerIndex: actualCorrectIndex,
                    userAnswerIndex: selectedIndex,
                    savedTime: new Date().toLocaleString('ko-KR')
                };

                if (existingIndex !== -1) {
                    wrongAnswers[existingIndex] = newEntry;
                } else {
                    wrongAnswers.push(newEntry);
                }

                localStorage.setItem(STORAGE_KEY, JSON.stringify(wrongAnswers));
            } catch (e) {
                console.error("저장 중 데이터 충돌 에러:", e);
            }
        }

        function deleteSingleWrongAnswer(index) {
            try {
                const wrongAnswers = getWrongAnswers();
                wrongAnswers.splice(index, 1);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(wrongAnswers));
                showReviewMode();
            } catch (e) {
                console.error("개별 삭제 중 에러 발생:", e);
            }
        }

        function clearWrongAnswers() {
            if (confirm('복습 문제를 모두 삭제하시겠습니까?')) {
                localStorage.removeItem(STORAGE_KEY);
                showReviewMode(); 
            }
        }

        // ==========================================================
        // 퀴즈 데이터 순차 로딩 (암호화 토큰 기반 복호화 지원)
        // ==========================================================
        let isQuizLoading = false;

        async function loadQuizData(retryCount = 0) {
            if (isQuizLoading && retryCount === 0) return;
            isQuizLoading = true;

            pageTitle.textContent = '오늘의 상식 퀴즈';
            quizContainer.innerHTML = '';
            navButtons.innerHTML = '';
            loadingDiv.style.display = 'block';
            loadingDiv.innerText = retryCount > 0 ? `서버 응답 기다리는 중... (재시도 ${retryCount}/2)` : "데이터 로딩 중...";

            try {
                const quizRes = await fetch(QUIZ_API_URL);

                if (quizRes.status === 503 && retryCount < 2) {
                    setTimeout(() => {
                        isQuizLoading = false;
                        loadQuizData(retryCount + 1);
                    }, 3000);
                    return;
                }

                if (!quizRes.ok) throw new Error(`퀴즈 데이터 로드 실패 (${quizRes.status})`);
                const quizData = await quizRes.json();

                // 💡 전달받은 암호화 토큰들을 추출하여 정답 요청 URL 쿼리로 전달
                const tokens = quizData.map(q => q.token).filter(Boolean).join(',');
                const answerRes = await fetch(`${ANSWER_KEY_API_URL}?tokens=${encodeURIComponent(tokens)}`);
                
                if (!answerRes.ok) throw new Error(`정답 키 로드 실패 (${answerRes.status})`);
                const answerMap = await answerRes.json();

                currentQuizData = quizData.map(q => ({
                    ...q,
                    correctAnswerIndex: answerMap[q.id] ?? q.correctAnswerIndex
                }));
                
                loadingDiv.style.display = 'none';
                currentQuestionIndex = 0;
                score = 0;
                displayQuestion();

            } catch (error) {
                console.error(error);
                loadingDiv.style.display = 'none';
                quizContainer.innerHTML = `<p style="color: #dc3545; text-align: center;">로딩 실패: ${escapeHtml(error.message)}<br>잠시 후 다시 시도해 주세요.</p>`;
                showHomeButtons();
            } finally {
                isQuizLoading = false;
            }
        }

        function displayQuestion() {
            if (currentQuestionIndex >= currentQuizData.length) {
                showResults();
                return;
            }

            const question = currentQuizData[currentQuestionIndex];
            
            if (typeof question.correctAnswerIndex === 'undefined' || isNaN(question.correctAnswerIndex)) {
                quizContainer.innerHTML = `<p style="color: #dc3545;">[오류] 정답 정보를 가져오지 못했습니다.</p>`;
                return;
            }
            
            const choicesHtml = question.choices.map((choice, index) => `
                <button onclick="checkAnswer(${index})">${formatText(choice)}</button>
            `).join('');

            quizContainer.innerHTML = `
                <div class="question-text">(${currentQuestionIndex + 1}/${currentQuizData.length}) ${formatText(question.question)}</div>
                <div class="choices" id="choices-container">
                    ${choicesHtml}
                </div>
                <div id="feedback" style="margin-top: 15px; font-weight: bold;"></div>
                <div id="explanation-box">
                    <strong>해설:</strong> <span id="explanation-text">${formatText(question.explanation) || '해설이 제공되지 않았습니다.'}</span>
                </div>
            `;
            navButtons.innerHTML = ''; 
        }

        function checkAnswer(selectedIndex) {
            const question = currentQuizData[currentQuestionIndex];
            const actualCorrectIndex = question.correctAnswerIndex;
            const isCorrect = (selectedIndex === actualCorrectIndex);
            
            const choicesContainer = document.getElementById('choices-container');
            const feedbackDiv = document.getElementById('feedback');
            const explanationBox = document.getElementById('explanation-box'); 
            
            Array.from(choicesContainer.children).forEach((button, index) => {
                button.disabled = true;
                if (index === actualCorrectIndex) {
                    button.classList.add('correct'); 
                }
                if (index === selectedIndex && !isCorrect) {
                    button.classList.add('incorrect'); 
                }
            });

            if (isCorrect) {
                score++;
                feedbackDiv.innerHTML = '<span style="color: #28a745;">✅ 정답입니다!</span>';
            } else {
                feedbackDiv.innerHTML = '<span style="color: #dc3545;">❌ 오답입니다.</span>';
                addWrongAnswer(question, selectedIndex, actualCorrectIndex);
            }

            explanationBox.style.display = 'block';
            navButtons.innerHTML = `<button class="btn-primary" onclick="nextQuestion()">다음 문제 (${currentQuestionIndex + 1}/${currentQuizData.length})</button>`;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            displayQuestion();
        }

        function showResults() {
            quizContainer.innerHTML = `
                <h2>퀴즈 종료!</h2>
                <p id="result-message">최종 점수: ${score} / ${currentQuizData.length}</p>
                <p style="color: #6c757d;">틀린 문제는 복습 모드에 자동 저장되었습니다.</p>
            `;
            showHomeButtons();
        }

        // ==========================================================
        // 복습 모드
        // ==========================================================
        function showReviewMode() {
            pageTitle.textContent = '📝 오답 복습 모드';
            navButtons.innerHTML = '';
            
            const wrongAnswers = getWrongAnswers();
            
            if (wrongAnswers.length === 0) {
                quizContainer.innerHTML = `<p style="text-align: center; color: #6c757d;">현재 저장된 오답 문제가 없습니다.<br>메인 퀴즈에서 문제를 틀리면 자동 저장됩니다!</p>`;
            } else {
                const reviewListHtml = wrongAnswers.map((item, index) => {
                    const correctAnswerText = item.choices?.[item.correctAnswerIndex] ?? '정답 정보 없음';
                    const userAnswerText = item.choices?.[item.userAnswerIndex] ?? '선택 정보 없음';

                    return `
                        <li class="review-item">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                                <div class="question-text" style="width: 80%;">Q: ${formatText(item.question)}</div>
                                <button class="btn-danger" style="padding: 4px 10px; font-size: 0.8em; margin: 0;" onclick="deleteSingleWrongAnswer(${index})">🗑</button>
                            </div>
                            <p>선택했던 오답: <span style="color: #dc3545; font-weight: bold;">${formatText(userAnswerText)}</span></p>
                            <p class="correct-answer">정답: ${formatText(correctAnswerText)}</p>
                            <div class="review-explanation">해설: ${formatText(item.explanation) || '해설이 제공되지 않았습니다.'}</div>
                            <p style="font-size: 0.8em; color: #6c757d; margin-top: 8px;">(저장 시간: ${item.savedTime})</p>
                        </li>
                    `;
                }).join('');

                quizContainer.innerHTML = `
                    <h3 style="margin-top: 0;">총 ${wrongAnswers.length}개의 복습 문제</h3>
                    <ul id="review-list">
                        ${reviewListHtml}
                    </ul>
                    <button class="btn-danger" onclick="clearWrongAnswers()">복습 문제 전체 삭제</button>
                `;
            }
            showHomeButtons();
        }

        function showHomeButtons() {
            navButtons.innerHTML = `
                <button class="btn-primary" onclick="loadQuizData()">퀴즈 시작</button>
                <button class="btn-warning" onclick="showReviewMode()">복습 모드 (${getWrongAnswers().length})</button>
            `;
        }

        showHomeButtons();
    </script>
</body>
</html>
