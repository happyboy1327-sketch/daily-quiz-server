<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 상식 퀴즈</title>

<style>
body{
    margin:0;
    padding:0;
    background:#f4f6fb;
    font-family:Arial,sans-serif;
}

.container{
    max-width:600px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#d01c67;
}

button{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.start{
    background:#4a90e2;
    color:white;
}

.choice{
    background:#fff;
    border:1px solid #ddd;
    text-align:left;
}

.choice:hover{
    background:#eef7ff;
}

.correct{
    background:#d4edda!important;
}

.wrong{
    background:#f8d7da!important;
}

.explanation{
    margin-top:20px;
    padding:15px;
    background:#eef7ff;
    border-left:5px solid #4a90e2;
}

.review{
    background:#fff7d6;
    padding:15px;
    margin:10px 0;
    border-radius:8px;
}

#loading{
    text-align:center;
    color:#d01c67;
}
</style>

</head>

<body>

<div class="container">

<h1>오늘의 상식 퀴즈</h1>

<div id="loading"></div>

<div id="quiz">
<p>퀴즈 시작 버튼을 눌러주세요.</p>
</div>

<div id="menu">
<button class="start" onclick="startQuiz()">
퀴즈 시작
</button>

<button onclick="showReview()">
오답 복습
</button>
</div>

</div>


<script>

const QUIZ_API_URL="/api/quiz";
const STORAGE_KEY="wrong_answers";


let quizData=[];
let current=0;
let score=0;



function getWrong(){

    return JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
    );

}



function saveWrong(q,userAnswer){

    let data=getWrong();

    data.push({
        question:q.question,
        choices:q.choices,
        correct:q.answer,
        user:userAnswer,
        explanation:q.explanation,
        time:new Date().toLocaleString()
    });


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}



async function startQuiz(){

    document.getElementById("loading").innerHTML=
    "문제 생성 중...";

    document.getElementById("quiz").innerHTML="";
    document.getElementById("menu").innerHTML="";


    try{

        const response=await fetch(
            QUIZ_API_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({})
            }
        );


        const data=await response.json();


        if(!data.success){
            throw new Error(data.message);
        }


        quizData=data.questions;

        current=0;
        score=0;


        document.getElementById("loading").innerHTML="";


        showQuestion();


    }catch(error){

        document.getElementById("loading").innerHTML="";

        document.getElementById("quiz").innerHTML=
        `
        <p style="color:red">
        오류 : ${error.message}
        </p>
        `;

        showMenu();

    }

}



function showQuestion(){

    if(current>=quizData.length){

        showResult();
        return;

    }


    const q=quizData[current];


    let html=`

    <h3>
    ${current+1}/${quizData.length}
    ${q.question}
    </h3>

    <div id="choices">

    `;


    q.choices.forEach((choice,index)=>{

        html+=`

        <button class="choice"
        onclick="checkAnswer(${index})">

        ${index+1}. ${choice}

        </button>

        `;

    });


    html+=`

    </div>

    <div id="feedback"></div>

    <div id="explain"></div>

    `;


    document.getElementById("quiz").innerHTML=html;

}



function checkAnswer(selected){


    const q=quizData[current];

    const buttons=
    document.querySelectorAll(".choice");


    buttons.forEach((btn,index)=>{

        btn.disabled=true;


        if(index===q.answer){

            btn.classList.add("correct");

        }


        if(index===selected && selected!==q.answer){

            btn.classList.add("wrong");

        }

    });



    if(selected===q.answer){

        score++;

        document.getElementById("feedback").innerHTML=
        "<p style='color:green'>정답입니다!</p>";

    }else{

        saveWrong(q,selected);

        document.getElementById("feedback").innerHTML=
        "<p style='color:red'>오답입니다.</p>";

    }



    document.getElementById("explain").innerHTML=

    `

    <div class="explanation">

    <b>해설</b><br>

    ${q.explanation || "해설 없음"}

    </div>


    <button onclick="nextQuestion()">

    다음 문제

    </button>

    `;


}



function nextQuestion(){

    current++;

    showQuestion();

}



function showResult(){

    document.getElementById("quiz").innerHTML=

    `

    <h2>퀴즈 종료</h2>

    <p>
    점수 : ${score}/${quizData.length}
    </p>

    `;


    showMenu();

}



function showReview(){


    const data=getWrong();


    if(data.length===0){

        document.getElementById("quiz").innerHTML=
        "저장된 오답이 없습니다.";

        return;

    }


    let html="<h2>오답 복습</h2>";


    data.forEach(q=>{


        html+=`

        <div class="review">

        <b>${q.question}</b>

        <p>
        내 답:
        ${q.choices[q.user]}
        </p>


        <p style="color:blue">

        정답:
        ${q.choices[q.correct]}

        </p>


        <p>
        해설:
        ${q.explanation}
        </p>


        </div>

        `;


    });


    document.getElementById("quiz").innerHTML=html;

}



function showMenu(){

    document.getElementById("menu").innerHTML=

    `

    <button class="start" onclick="startQuiz()">
    다시 시작
    </button>


    <button onclick="showReview()">
    오답 복습
    </button>

    `;

}

</script>


</body>
</html>
